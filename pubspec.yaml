name: physique57
description: "Employee Request Management System (ERMS) - Production Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0+1
  google_sign_in: ^6.2.1
  firebase_auth: ^5.1.2
  firebase_core: ^3.2.0
  cloud_firestore: ^5.1.0
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.2.1
  intl: ^0.19.0
  file_picker: ^8.0.7
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  uuid: ^4.4.0
  webview_flutter: ^4.8.0
  lottie: ^3.1.2
  pdf: ^3.13.0
  printing: ^5.15.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
